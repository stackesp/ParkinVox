[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinvox"
version = "0.1.0"
description = "Parkinson voice feature extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11,<1",
    "numpy>=2,<3",
    "soundfile>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
validation = [
    "pandas>=2,<4",
    "praat-parselmouth>=0.4,<1",
]
data = [
    "datasets>=3,<5",
    "sbvoicedb>=1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
